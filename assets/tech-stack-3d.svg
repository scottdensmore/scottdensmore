<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 175" width="100%" height="100%">
  <defs>
    <linearGradient id="rackBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <style>
      .cube-float { animation: floatY 3.2s ease-in-out infinite; }
      .shadow-pulse { animation: pulseS 3.2s ease-in-out infinite; transform-origin: center; }
      @keyframes floatY {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes pulseS {
        0%, 100% { opacity: 0.30; }
        50% { opacity: 0.12; }
      }
      .cube-label { font: 800 12px 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; fill: #090d16; letter-spacing: 0.5px; }
      .cube-tag { font: 600 9.5px 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 1.1px; }
      .rack-title { font: 700 10.5px 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace; fill: #38bdf8; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect x="2" y="2" width="936" height="171" rx="16" fill="url(#rackBg)" stroke="#1e293b" stroke-width="1.5"/>
