<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
  <defs>
    <style>
      .top-layer { animation: liftTop 2.6s ease-in-out infinite; }
      .mid-layer { animation: liftMid 2.6s ease-in-out infinite; }
      @keyframes liftTop { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-2px); } }
      @keyframes liftMid { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-1px); } }
    </style>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.5"/>
  <!-- Bottom Layer -->
  <polygon points="16,16.5 25.5,21 16,25.5 6.5,21" fill="#3b82f6" stroke="#0f172a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Middle Layer -->
  <g class="mid-layer">
    <polygon points="16,12 25.5,16.5 16,21 6.5,16.5" fill="#a855f7" stroke="#0f172a" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
  <!-- Top Layer -->
  <g class="top-layer">
    <polygon points="16,7.5 25.5,12 16,16.5 6.5,12" fill="#f43f5e" stroke="#0f172a" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
